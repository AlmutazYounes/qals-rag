[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qals"
version = "0.3.0"
description = "Query-Adaptive Late Segmentation for Retrieval-Augmented Generation"
authors = [
    { name = "Mohammad Bani Younes", email = "mohamed.banyyounes@anu.edu.jo" },
    { name = "Mutaz Younes", email = "mutazyounes@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "matplotlib>=3.5.0",
    "reportlab>=3.6.0"
]

[project.optional-dependencies]
dense = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "langchain-text-splitters>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
